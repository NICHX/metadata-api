services:
  metadata-api:
    build: .
    container_name: metadata-api
    ports:
      - "8000:8000"
    environment:
      # TMDb API 密钥（必填）
      - MEDIA_RENAMER_TMDB_API_KEY=${TMDB_API_KEY:-}
      # BGM API 密钥（可选）
      - MEDIA_RENAMER_BGM_API_KEY=${BGM_API_KEY:-}
      # 部署模式: local / remote
      - MEDIA_RENAMER_MODE=${MEDIA_RENAMER_MODE:-local}
    volumes:
      # 映射媒体文件夹（本地模式需要）
      - /path/to/your/media:/media:ro
      # 持久化数据（配置文件 + API 缓存，统一存储避免重复请求）
      - media-renamer-data:/app/data
    restart: unless-stopped

volumes:
  media-renamer-data: