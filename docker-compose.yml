services:
  metadata-api:
    build: .
    container_name: metadata-api
    ports:
      - "8000:8000"
    environment:
      # TMDb API 密钥（必填）
      - METADATA_TMDB_API_KEY=${TMDB_API_KEY:-}
      # BGM API 密钥（可选）
      - METADATA_BGM_API_KEY=${BGM_API_KEY:-}
      # AI API 配置（可选，用于从目录路径推断剧名/电影名）
      - METADATA_AI_API_KEY=${AI_API_KEY:-}
      - METADATA_AI_BASE_URL=${AI_BASE_URL:-https://api.deepseek.com}
      - METADATA_AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      # 部署模式: local / remote
      - METADATA_MODE=${METADATA_MODE:-local}
      # Web UI 登录凭证（留空则不需要登录）
      - METADATA_WEB_USERNAME=${WEB_USERNAME:-}
      - METADATA_WEB_PASSWORD=${WEB_PASSWORD:-}
    volumes:
      # 映射媒体文件夹（本地模式需要）
      - /path/to/your/media:/media:ro
      # 持久化数据（配置文件 + API 缓存，统一存储避免重复请求）
      - media-renamer-data:/app/data
    restart: unless-stopped

volumes:
  media-renamer-data: